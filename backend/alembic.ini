# alembic.ini — gerado para FáciLPI
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# SAFE2-A/B02: sem URL default. Esta linha apontava para ../storage/app.db — o
# banco historico protegido — e era a ultima fonte da cadeia de resolucao em
# env.py, entao `alembic upgrade head` sem variavel migrava o artefato historico.
# O destino agora vem de DATABASE_URL ou de -x database_url=, e a ausencia dos
# dois e erro explicito.
# sqlalchemy.url = (definida em env.py, nunca aqui)

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
